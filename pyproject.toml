[project]
name = "hermes-jev"
version = "0.2.2.dev17"
description = "Provider-neutral Reflex decision nervous system with Jev/Laya/OpenJev integration, evidence-backed Kanban supervision, and SSH workers for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KeelTrace community"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/keeltrace/hermes-jev"
Issues = "https://github.com/keeltrace/hermes-jev/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "tomli>=2,<3; python_version < '3.11'"]
laya = ["laya==0.3.3"]
