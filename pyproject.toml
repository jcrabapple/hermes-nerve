[project]
name = "hermes-jev"
version = "0.2.1.2"
description = "Asynchronous Jev decision nervous system and context-value governor for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KeelTrace community"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/keeltrace/hermes-jev"
Issues = "https://github.com/keeltrace/hermes-jev/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "tomli>=2,<3; python_version < '3.11'"]
