name: hermes-jev
version: "0.2.2.dev2"
description: "Asynchronous Jev decision nervous system for Hermes Agent: turn admission, adaptive local routing, confidence-gated challenges, typed decisions, verification, and context governance."
author: "KeelTrace community"
license: MIT
homepage: https://github.com/keeltrace/hermes-jev
tags: [jev, typesafe, opencode, system-one, decisions, routing, verification, context, safety, automation]
provides_tools:
  - jev_decide
  - jev_rank
  - jev_verify
  - jev_assess
  - jev_context_curate
  - jev_context_rehydrate
  - jev_stats
  - jev_nervous_event
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - transform_tool_result
  - pre_verify
  - post_llm_call
  - on_session_end
requires_env: []
config_schema:
  jev_provider: {type: str, default: "openrouter", description: "Jev transport: openrouter, typesafe, or opencode"}
  typesafe_model: {type: str, default: "jev-latest", description: "Direct TypeSafe model id"}
  opencode_model: {type: str, default: "jev-1.13", description: "OpenCode Zen System One model id. Hermes integration supports paid jev-1.13 only."}
  nervous_enabled: {type: bool, default: true, description: "Enable the asynchronous Jev nervous system"}
  nervous_turn_admission: {type: bool, default: true, description: "Run one asynchronous OFF/WATCH/ON Jev admission classification per user turn"}
  nervous_mode: {type: str, default: "correct_next", description: "Nervous authority mode: shadow, correct_next, or precommit"}
  nervous_challenge_confidence: {type: float, default: 0.86, description: "Minimum confidence for Jev disagreement to become a Hermes challenge"}
  nervous_call_threshold: {type: float, default: 0.58, description: "Adaptive local relevance threshold for remote Jev assessments; not an event-count poll"}
  nervous_max_provider_calls_per_turn: {type: int, default: 96, description: "Hard safety budget per turn; adaptive routing remains the primary limiter"}
  nervous_event_preview_chars: {type: int, default: 1200, description: "Maximum result/evidence preview retained in a nervous-system event"}
  nervous_retain_recent_events: {type: int, default: 64, description: "Recent local event summaries retained per active turn"}
  nervous_emit_prompt_hint: {type: bool, default: false, description: "Inject a compact hint telling Hermes when it may emit explicit jev_nervous_event decisions"}
  nervous_local_learning: {type: bool, default: true, description: "Use labeled local outcome history to tune router sensitivity after enough samples exist"}
  nervous_local_learning_min_samples: {type: int, default: 8, description: "Minimum labeled outcomes before local historical calibration may influence routing"}
  nervous_repeated_failure_local_replan_at: {type: int, default: 3, description: "Identical failure count that activates the provider-independent local REPLAN loop breaker (2-20)"}
  jev_model: {type: str, default: "typesafe/jev-1.13", description: "OpenRouter Jev model id (model_id remains accepted for 0.1.5.1 compatibility)"}
  timeout_seconds: {type: float, default: 10.0, description: "Decision request timeout in seconds (1-120)"}
  gate_mode: {type: str, default: "off", description: "Automatic pre-tool gate: off, advisory, or enforce"}
  gate_scope: {type: str, default: "selective", description: "Gate coverage: selective bypasses conservative read-only calls locally; all evaluates every non-Jev call"}
  min_confidence: {type: float, default: 0.80, description: "Minimum confidence before an automatic allow/block verdict is trusted"}
  receipt_detail: {type: str, default: "hash", description: "Decision receipt state detail: hash or sanitized"}
  context_ledger_enabled: {type: bool, default: true, description: "Record privacy-minimized evidence/shadow events for curation and rehydration"}
  context_ledger_detail: {type: str, default: "sanitized", description: "Evidence ledger detail: sanitized (rehydratable) or hash"}
  context_preview_chars: {type: int, default: 1200, description: "Per-evidence preview chars sent to Jev during semantic curation (160-4000)"}
  context_anchor_chars: {type: int, default: 220, description: "Original prefix chars retained in deterministic anchors (40-1200)"}
  context_preserve_tail: {type: int, default: 4, description: "Newest explicit evidence items protected exactly (0-12)"}
  context_curation_mode: {type: str, default: "shadow", description: "Explicit curation mode: apply or shadow"}
  context_drop_max_needed: {type: float, default: 0.20, description: "DROP allowed only when P(needed_again) is at or below this value"}
  context_drop_max_exact: {type: float, default: 0.20, description: "DROP allowed only when P(exact_required) is at or below this value"}
  context_drop_min_superseded: {type: float, default: 0.75, description: "DROP requires P(superseded) at or above this value"}
  context_anchor_max_needed: {type: float, default: 0.55, description: "ANCHOR allowed when P(needed_again) is at or below this value"}
  context_anchor_max_exact: {type: float, default: 0.45, description: "ANCHOR allowed when P(exact_required) is at or below this value"}
  context_conflict_pin_min: {type: float, default: 0.70, description: "PIN evidence when P(unresolved conflict) meets this threshold"}
  context_engine_register: {type: bool, default: true, description: "Register the opt-in Jev ContextEngine with Hermes when the host supports it"}
  context_engine_mode: {type: str, default: "shadow", description: "Jev ContextEngine mode: apply or shadow"}
  context_engine_threshold_percent: {type: float, default: 0.72, description: "Context usage fraction that triggers Jev engine compaction"}
  context_engine_protect_first_n: {type: int, default: 3, description: "Non-system head messages protected by the Jev ContextEngine"}
  context_engine_protect_last_n: {type: int, default: 6, description: "Newest non-system messages protected by the Jev ContextEngine"}
  context_engine_shadow_trigger_percent: {type: float, default: 0.55, description: "In engine shadow mode, usage fraction that triggers a non-mutating curation plan"}
  context_engine_fallback_builtin: {type: bool, default: true, description: "Fall back to Hermes built-in ContextCompressor when Jev cannot safely reclaim context"}
