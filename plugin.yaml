name: hermes-jev
version: "0.1.5.5"
description: "System One decision runtime and context-value governor for Hermes Agent: typed Jev decisions, verification, evidence curation/rehydration, receipts, advisory gating, and an opt-in ContextEngine."
author: "KeelTrace community"
license: MIT
homepage: https://github.com/keeltrace/hermes-jev
tags: [jev, typesafe, system-one, decisions, routing, verification, context, safety, automation]
provides_tools:
  - jev_decide
  - jev_rank
  - jev_verify
  - jev_assess
  - jev_context_curate
  - jev_context_rehydrate
  - jev_stats
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_env: []
optional_env:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key when jev_provider=openrouter"
    url: "https://openrouter.ai/keys"
    password: true
  - name: TYPESAFE_API_KEY
    description: "TypeSafe API key when jev_provider=typesafe"
    url: "https://typesafe.ai/"
    password: true
config_schema:
  jev_provider: {type: str, default: "openrouter", description: "Jev transport: openrouter or typesafe"}
  jev_model: {type: str, default: "typesafe/jev-1.13", description: "OpenRouter Jev model id (model_id remains accepted for 0.1.5.1 compatibility)"}
  typesafe_model: {type: str, default: "jev-latest", description: "Direct TypeSafe System One model id"}
  timeout_seconds: {type: float, default: 10.0, description: "Decision request timeout in seconds (1-120)"}
  gate_mode: {type: str, default: "off", description: "Automatic pre-tool gate: off, advisory, or enforce"}
  gate_scope: {type: str, default: "selective", description: "Gate coverage: selective bypasses conservative read-only calls locally; all evaluates every non-Jev call"}
  min_confidence: {type: float, default: 0.80, description: "Minimum confidence before an automatic allow/block verdict is trusted"}
  receipt_detail: {type: str, default: "hash", description: "Decision receipt state detail: hash or sanitized"}
  context_ledger_enabled: {type: bool, default: true, description: "Observe post-tool evidence into the local context ledger"}
  context_ledger_detail: {type: str, default: "sanitized", description: "Context ledger detail: sanitized enables rehydration; hash stores no recoverable content"}
  context_preview_chars: {type: int, default: 1200, description: "Maximum characters sent to Jev per context evidence preview"}
  context_anchor_chars: {type: int, default: 220, description: "Maximum original prefix retained in deterministic evidence anchors"}
  context_preserve_tail: {type: int, default: 4, description: "Newest evidence units locally protected from explicit curation"}
  context_curation_mode: {type: str, default: "shadow", description: "Explicit curation default: shadow or apply"}
  context_drop_max_needed: {type: float, default: 0.20, description: "Maximum needed-again probability eligible for DROP"}
  context_drop_max_exact: {type: float, default: 0.20, description: "Maximum exact-required probability eligible for DROP"}
  context_drop_min_superseded: {type: float, default: 0.75, description: "Minimum superseded probability eligible for DROP"}
  context_anchor_max_needed: {type: float, default: 0.55, description: "Maximum needed-again probability eligible for ANCHOR"}
  context_anchor_max_exact: {type: float, default: 0.45, description: "Maximum exact-required probability eligible for ANCHOR"}
  context_conflict_pin_min: {type: float, default: 0.70, description: "Minimum conflict probability that forces PIN"}
  context_engine_register: {type: bool, default: true, description: "Register the opt-in Jev ContextEngine with Hermes when the host supports it"}
  context_engine_mode: {type: str, default: "shadow", description: "Jev ContextEngine mode: apply or shadow"}
  context_engine_threshold_percent: {type: float, default: 0.72, description: "Context usage fraction that triggers Jev engine compaction"}
  context_engine_protect_first_n: {type: int, default: 3, description: "Non-system head messages protected by the Jev ContextEngine"}
  context_engine_protect_last_n: {type: int, default: 6, description: "Newest non-system messages protected by the Jev ContextEngine"}
  context_engine_shadow_trigger_percent: {type: float, default: 0.55, description: "In engine shadow mode, usage fraction that triggers a non-mutating curation plan"}
  context_engine_fallback_builtin: {type: bool, default: true, description: "Fall back to Hermes built-in ContextCompressor when Jev cannot safely reclaim context"}
